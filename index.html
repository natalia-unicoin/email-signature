<!doctype html><html><head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Signature Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #ffffff;
    --bg-panel: #ffffff;
    --field-bg: #f9f9f9;
    --border: #e6dbec;
    --ink: #241a2c;
    --ink-soft: #6b5c76;
    /* Identidad de la empresa elegida: el gestor cambia --brand y --brand-deep al cambiar de empresa. */
    --brand: #A03FA3;
    --on-brand: #ffffff;
    --brand-deep: #7E2F82;
    --purple: var(--brand-deep);
    --purple-deep: color-mix(in srgb, var(--brand-deep) 78%, #000);
    --orchid: var(--brand);
    --orchid-soft: color-mix(in srgb, var(--brand) 14%, var(--bg-panel));
    --success: #2f9e63;
    --success-bg: #e7f6ee;
    --shadow: 0 1px 2px rgba(93,31,106,0.06), 0 8px 24px rgba(93,31,106,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #1a1420;
      --bg-panel: #241c2c;
      --field-bg: #241c2c;
      --border: #3a2d44;
      --ink: #f1e9f5;
      --ink-soft: #b6a5c2;
      --on-brand: #1a1420;
      --purple: color-mix(in srgb, var(--brand) 62%, #fff);
      --purple-deep: color-mix(in srgb, var(--brand) 42%, #fff);
      --orchid: color-mix(in srgb, var(--brand) 70%, #fff);
      --orchid-soft: color-mix(in srgb, var(--brand) 24%, var(--bg-panel));
      --success: #6cd6a0;
      --success-bg: #1f3329;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg: #1a1420;
    --bg-panel: #241c2c;
    --border: #3a2d44;
    --ink: #f1e9f5;
    --ink-soft: #b6a5c2;
    --on-brand: #1a1420;
    --purple: color-mix(in srgb, var(--brand) 62%, #fff);
    --purple-deep: color-mix(in srgb, var(--brand) 42%, #fff);
    --orchid: color-mix(in srgb, var(--brand) 70%, #fff);
    --orchid-soft: color-mix(in srgb, var(--brand) 24%, var(--bg-panel));
    --success: #6cd6a0;
    --success-bg: #1f3329;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{ box-sizing: border-box; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 40px 24px 64px; }

  header.top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    margin-bottom: 32px; flex-wrap: wrap;
  }
  h1{
    font-family:'Inter', sans-serif; font-weight:800; letter-spacing:-0.01em;
    font-size: clamp(24px, 3vw, 32px); margin: 6px 0 6px;
  }
  .sub{ color: var(--ink-soft); font-size: 14.5px; max-width: 46ch; line-height:1.5; }

  .grid{ display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; align-items:start; }
  @media (max-width: 820px){ .grid{ grid-template-columns: minmax(0,1fr); } }

  .panel{
    background: var(--bg-panel); border:1px solid var(--border); border-radius: 16px;
    padding: 28px; box-shadow: var(--shadow);
  }
  .panel h2{ font-family:'Inter',sans-serif; font-size:16px; font-weight:700; margin:0 0 4px; }
  .panel .hint{ color:var(--ink-soft); font-size:13px; margin: 0 0 20px; line-height:1.5; }

  label{ display:block; font-size:13px; font-weight:600; color: var(--ink-soft); margin: 16px 0 6px; }
  label:first-of-type{ margin-top:0; }
  input[type="text"], input[type="email"], input[type="tel"], select{
    width:100%; padding: 10px 12px; border-radius:10px; border:1px solid var(--border);
    background: var(--field-bg); color: var(--ink); font: inherit; font-size:14.5px;
  }
  select{ appearance:none; -webkit-appearance:none; cursor:pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b5c76' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position: right 12px center; padding-right:34px;
  }
  input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus, select:focus{ outline: 2px solid var(--orchid); outline-offset:1px; }
  .type-hint{ font-size:12.5px; color:var(--ink-soft); margin:6px 0 0; line-height:1.5; }

  .photo-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  @media (max-width: 480px){ .file-btn{ padding:10px 10px; font-size:13px; } }
  .photo-preview{
    width:72px; height:72px; border-radius:50%; background: var(--orchid-soft);
    border:1px solid var(--border); overflow:hidden; flex:none;
    display:flex; align-items:center; justify-content:center; color:var(--orchid); font-size:11px; text-align:center;
  }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .file-btn{
    border:1px dashed var(--border); border-radius:10px; padding:10px 14px; font-size:13.5px; font-weight:600;
    color: var(--purple); cursor:pointer; background:transparent; font-family:inherit;
  }
  .file-btn:hover{ background: var(--orchid-soft); }
  .file-btn.secondary-file{ font-weight:500; color: var(--ink-soft); }
  input[type="file"]{ display:none; }

  /* crop modal */
  .crop-overlay{
    position:fixed; inset:0; background: rgba(20,10,24,0.55); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .crop-modal{
    background: var(--bg-panel); border-radius:16px; padding:24px; width:100%; max-width:420px;
    box-shadow: var(--shadow); display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .crop-modal h3{ font-size:15px; font-weight:700; margin:0; align-self:flex-start; }
  .crop-modal .crop-hint{ font-size:12.5px; color:var(--ink-soft); align-self:flex-start; margin-top:-10px; }
  .crop-stage{
    position:relative; touch-action:none; background:#111; border-radius:8px; overflow:hidden;
    max-width:100%; line-height:0;
  }
  .crop-stage img{ display:block; max-width:100%; user-select:none; -webkit-user-drag:none; }
  .crop-box{
    position:absolute; border:2px solid #fff; box-shadow:0 0 0 9999px rgba(0,0,0,.55);
    border-radius:50%; cursor:move; box-sizing:border-box; touch-action:none;
  }
  .crop-tip{
    font-size:12.5px; color:var(--ink); align-self:flex-start; margin:-6px 0 0; line-height:1.5;
    background: var(--orchid-soft); border-radius:10px; padding:10px 12px;
  }
  .crop-guide{
    position:absolute; inset:0; width:100%; height:100%; pointer-events:none;
    fill:none; stroke:#fff; stroke-width:1.2; stroke-dasharray:3 2.5; opacity:.7;
  }
  .crop-handle{
    position:absolute; width:16px; height:16px; right:-8px; bottom:-8px;
    background:#fff; border:2px solid var(--purple); border-radius:50%; cursor:nwse-resize; touch-action:none;
  }
  .crop-actions{ display:flex; gap:10px; width:100%; justify-content:flex-end; }

  .actions{ display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; }
  button.primary{
    background: var(--purple); color: var(--on-brand); border:none; border-radius:10px; padding: 12px 20px;
    font: inherit; font-weight:700; font-size:14px; cursor:pointer; transition: background .15s, transform .1s;
  }
  button.primary:hover{ background: var(--purple-deep); }
  button.primary:active{ transform: translateY(1px); }
  button.secondary{
    background: transparent; color: var(--purple); border:1px solid var(--border); border-radius:10px;
    padding: 12px 18px; font: inherit; font-weight:700; font-size:14px; cursor:pointer;
  }
  button.secondary:hover{ background: var(--orchid-soft); }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  .status{ font-size:13px; margin-top:12px; display:none; align-items:center; gap:6px; }
  .status.show{ display:flex; }
  .status.ok{ color: var(--success); }
  .status.err{ color: #c0392b; }

  .preview-card{
    background: #fff; border-radius: 14px; border:1px solid var(--border);
    padding: 22px; box-shadow: var(--shadow); overflow-x:auto;
  }
  #sigPreview{ width:max-content; }
  .preview-label{ font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color: var(--ink-soft); margin-bottom:14px; }

  .gmail-tip{
    margin-top:18px; padding:14px 16px; border-radius:12px; background: var(--orchid-soft);
    font-size:13px; color: var(--ink); line-height:1.6;
  }
  .company-toggle{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:0 0 26px; }
  .company-toggle button{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; position:relative; min-height:52px; text-align:center;
    border:2px solid var(--border); background:var(--field-bg); color:var(--ink-soft); font:inherit; font-weight:700; font-size:15px;
    padding:12px 10px; border-radius:14px; cursor:pointer; transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .company-toggle button:hover{ border-color: var(--tile, var(--brand)); transform:translateY(-1px); }
  .company-toggle button[aria-selected="true"]{ border-color: var(--tile, var(--brand)); color: var(--ink); box-shadow:0 0 0 3px color-mix(in srgb, var(--tile, var(--brand)) 28%, transparent); }
  .company-toggle button .soon{ font-weight:500; font-size:11px; opacity:.75; margin-left:6px; }
  .lang-toggle{ display:flex; gap:2px; padding:3px; background:var(--field-bg); border:1px solid var(--border); border-radius:10px; align-self:flex-start; }
  .lang-toggle button{ border:0; background:transparent; color:var(--ink-soft); font:inherit; font-weight:700; font-size:12.5px; padding:6px 10px; border-radius:7px; cursor:pointer; }
  .lang-toggle button[aria-pressed="true"]{ background: var(--purple); color: var(--on-brand); }
  .pending-note{
    font-size:13.5px; line-height:1.6; color:var(--ink); background:var(--orchid-soft);
    border-radius:12px; padding:16px 18px; max-width:46ch;
  }
  [hidden]{ display:none !important; }
</style>

<div class="wrap">

  <header class="top">
    <div>
      <h1>Signature Studio</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="lang-toggle" id="langToggle" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="es" aria-pressed="false">ES</button></div>
  </header>

  <div class="company-toggle" id="companyToggle" role="tablist" aria-label="Empresa"></div>

  <section id="viewGenerate">
    <div class="grid">
      <div class="panel">
        <h2 data-i18n="panelTitle"></h2>
        <p class="hint" data-i18n="hint"></p>

        <label for="fName" data-i18n="name"></label>
        <input type="text" id="fName" data-i18n-ph="namePh" />

        <label for="fTitle" data-i18n="title"></label>
        <input type="text" id="fTitle" data-i18n-ph="titlePh" />

        <div id="rowEmail">
          <label for="fEmail" data-i18n="email"></label>
          <div style="display:flex;align-items:stretch;">
            <input type="text" id="fEmail" data-i18n-ph="emailPh" style="flex:1;min-width:0;border-top-right-radius:0;border-bottom-right-radius:0;" />
            <div style="display:flex;align-items:center;padding:0 12px;border:1px solid var(--border);border-left:none;border-top-right-radius:10px;border-bottom-right-radius:10px;background:var(--field-bg);color:var(--ink-soft);font-size:14.5px;white-space:nowrap;" id="emailSuffix">@buildyourcastle.ai</div>
          </div>
        </div>

        <div id="rowPhone">
          <label for="fPhone" data-i18n="phone"></label>
          <div style="display:flex;gap:8px;align-items:stretch;">
            <select id="fCountry" aria-label="Country code" style="flex:none;width:112px;"><option value="AR" data-code="+54">🇦🇷 +54</option><option value="UY" data-code="+598">🇺🇾 +598</option><option value="CL" data-code="+56">🇨🇱 +56</option><option value="BR" data-code="+55">🇧🇷 +55</option><option value="MX" data-code="+52">🇲🇽 +52</option><option value="CO" data-code="+57">🇨🇴 +57</option><option value="PE" data-code="+51">🇵🇪 +51</option><option value="PY" data-code="+595">🇵🇾 +595</option><option value="BO" data-code="+591">🇧🇴 +591</option><option value="EC" data-code="+593">🇪🇨 +593</option><option value="VE" data-code="+58">🇻🇪 +58</option><option value="PA" data-code="+507">🇵🇦 +507</option><option value="CR" data-code="+506">🇨🇷 +506</option><option value="US" data-code="+1">🇺🇸 +1</option><option value="CA" data-code="+1">🇨🇦 +1</option><option value="ES" data-code="+34">🇪🇸 +34</option><option value="PT" data-code="+351">🇵🇹 +351</option><option value="GB" data-code="+44">🇬🇧 +44</option><option value="DE" data-code="+49">🇩🇪 +49</option><option value="FR" data-code="+33">🇫🇷 +33</option><option value="IT" data-code="+39">🇮🇹 +39</option><option value="AE" data-code="+971">🇦🇪 +971</option><option value="" data-code="">—</option></select>
            <input type="tel" inputmode="tel" autocomplete="tel-national" id="fPhone" data-i18n-ph="phonePh" style="flex:1;min-width:0;" />
          </div>
        </div>

        <div id="rowLinkedin" hidden>
          <label for="fLinkedin" data-i18n="linkedin"></label>
          <input type="text" id="fLinkedin" data-i18n-ph="linkedinPh" />
        </div>

        <div id="rowPhoto">
          <label data-i18n="photo"></label>
          <div class="photo-row">
            <div class="photo-preview" id="photoPreview"></div>
            <button type="button" class="file-btn" id="photoBtn" data-i18n="upload"></button>
            <button type="button" class="file-btn secondary-file" id="recropBtn" data-i18n="recrop" hidden></button>
            <button type="button" class="file-btn secondary-file" id="removePhotoBtn" data-i18n="remove" hidden></button>
            <input type="file" id="photoInput" accept="image/*" />
          </div>
        </div>

        <div class="actions">
          <button class="primary" id="copyBtn" type="button" data-i18n="copy"></button>
        </div>
        <div class="status" id="statusMsg"></div>

        <div class="gmail-tip" data-i18n-html="tip"></div>
      </div>

      <div class="preview-card">
        <div class="preview-label" data-i18n="preview"></div>
        <div id="sigPreview"></div>
        <p class="pending-note" id="draftNote" style="margin-top:16px;" hidden></p>
      </div>
    </div>
  </section>

</div>

<div class="crop-overlay" id="cropOverlay" hidden>
  <div class="crop-modal">
    <h3 data-i18n="cropTitle"></h3>
    <p class="crop-hint" data-i18n="cropHint"></p>
    <p class="crop-tip" data-i18n-html="cropTip"></p>
    <div class="crop-stage" id="cropStage">
      <img id="cropImgEl" alt="" />
      <div class="crop-box" id="cropBox">
        <svg class="crop-guide" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="38" r="15"/><path d="M12 100 C14 76 30 66 50 66 C70 66 86 76 88 100"/></svg>
        <div class="crop-handle" id="cropHandle"></div>
      </div>
    </div>
    <div class="crop-actions">
      <button type="button" class="secondary" id="cropCancel" data-i18n="cancel"></button>
      <button type="button" class="primary" id="cropApply" data-i18n="useThis"></button>
    </div>
  </div>
</div>

  // El campo de email solo pide el usuario (lo que va antes del @); el
  // dominio de Castle se agrega solo. Si alguien pega igual su email
  // completo por costumbre, se recorta todo lo que venga después del "@".
  function emailFromUser(raw){
    const user = String(raw || "").trim().split('@')[0];
    return user ? `${user}@${company().domain || "tu-dominio.com"}` : "";
  }

  // Cargo: mayúscula inicial en las palabras importantes (VP of Operations); respeta siglas (VP, CEO) y conectores (of, de, y...).
  const SMALL_WORDS = new Set(['a','an','and','as','at','but','by','for','in','of','on','or','the','to','de','del','la','las','el','los','y','e','o','u','en','para','con','por','al']);
  const ACRONYMS = new Set(['vp','svp','evp','avp','ceo','cto','cfo','coo','cmo','cio','cpo','chro','hr','it','pr','ux','ui','qa','ai','seo','b2b','b2c','csm','sdr','bdr','gm']);
  function titleCase(str){
    return String(str || '').trim().split(/\s+/).filter(Boolean).map((w, i) => {
      const low = w.toLowerCase();
      if (i > 0 && SMALL_WORDS.has(low)) return low;
      if (ACRONYMS.has(low)) return w.toUpperCase(); // vp -> VP
      if (w.length > 1 && w.length <= 4 && w === w.toUpperCase() && /[A-ZÁÉÍÓÚÑ]/.test(w)) return w; // siglas: CEO, COO
      const base = (w.length > 4 && w === w.toUpperCase()) ? low : w; // VENTAS -> Ventas; DevOps queda igual
      return base.replace(/(^|[-\/(])(\S)/g, (m, p, c) => p + c.toUpperCase());
    }).join(' ');
  }

  function escapeHtml(s){
    return String(s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // El texto del email se corta en varios <span> separados (usuario / @ / cada
  // parte del dominio). Se ve exactamente igual que "usuario@dominio.com" en
  // una sola línea, pero como en el HTML real no queda un texto corrido, ni
  // Gmail ni ningún otro cliente de correo lo reconoce como una dirección de
  // email — así que nunca lo autoconvierte en link azul, ni al pegarlo ni al
  // verlo en el correo ya enviado. No es un link de ningún tipo: es texto plano.
  function buildEmailDisplay(rawEmail, co){
    const EMAIL_COLOR = `color:${co.colors.data};text-decoration:none;`;
    const value = rawEmail || `tu@${co.domain}`;
    const at = value.indexOf('@');
    if (at === -1){
      return `<span style="${EMAIL_COLOR}">${escapeHtml(value)}</span>`;
    }
    const local = escapeHtml(value.slice(0, at));
    const domainParts = value.slice(at + 1).split('.').map(p => escapeHtml(p));
    const domainHtml = domainParts
      .map(p => `<span style="${EMAIL_COLOR}">${p}</span>`)
      .join(`<span style="${EMAIL_COLOR}">.</span>`);
    return `<span style="${EMAIL_COLOR}">${local}</span><span style="${EMAIL_COLOR}">@</span>${domainHtml}`;
  }

    const logoH = Math.round(logoW * co.logoRatio[1] / co.logoRatio[0]); // proporción real: tamaño fijo, siempre igual
    const photoCell = data.photo
      ? `<td style="padding-right:16px;vertical-align:top;"><img src="${data.photo}" width="${PHOTO_SIZE}" height="${PHOTO_SIZE}" style="display:block;width:${PHOTO_SIZE}px;height:${PHOTO_SIZE}px;border-radius:50%;object-fit:cover;max-width:none;min-width:${PHOTO_SIZE}px;" alt="${name}" /></td>`
      : `<td style="padding-right:16px;vertical-align:top;"><div style="width:${PHOTO_SIZE}px;height:${PHOTO_SIZE}px;border-radius:50%;background:${C.photoBg};"></div></td>`;
    const lab = co.rowLabels || {};
    const labelHtml = k => lab[k] ? `<span style="color:${C.data};">${escapeHtml(lab[k])}</span>` : "";
    const nameStyle = `${FONT}font-size:14px;font-weight:700;color:${C.name};line-height:1.3;white-space:nowrap;margin-top:0;`;
    // Ícono junto al nombre: va en su propia celda de tabla (no en la línea de texto) para que nunca agrande el interlineado.
    const nameHtml = (co.nameBadge && linkedin)
      ? `<table cellpadding="0" cellspacing="0" role="presentation" style="border-collapse:collapse;"><tr><td style="${nameStyle}">${name}</td><td style="padding-left:6px;vertical-align:middle;line-height:0;font-size:0;"><a href="${escapeHtml(linkedinHref)}" style="text-decoration:none;border:0;"><img src="${co.nameBadge}" width="16" height="16" alt="LinkedIn" style="display:block;border:0;width:16px;height:16px;max-width:none;" /></a></td></tr></table>`
      : `<div style="${nameStyle}">${name}</div>`;
    const rowHtml = {
      phone: phone
        ? `<div style="${FONT}font-size:13px;font-weight:400;color:${C.data};line-height:1.3;white-space:nowrap;margin-top:2px;">${labelHtml("phone")}${phone}</div>`
        : "",
      email: data.email
        ? `<div style="${FONT}font-size:13px;font-weight:400;line-height:1.3;white-space:nowrap;margin-top:2px;">${labelHtml("email")}${emailHtml}</div>`
        : "",
      // El texto va dentro de un <span> con color propio para que ningún cliente lo pinte de azul.
      linkedin: linkedin
        ? `<div style="${FONT}font-size:13px;font-weight:400;line-height:1.3;white-space:nowrap;margin-top:2px;"><a href="${escapeHtml(linkedinHref)}" style="color:${C.data};text-decoration:none;"><span style="color:${C.data};text-decoration:none;">${escapeHtml(co.linkedinLabel || "LinkedIn")}</span></a></div>`
        : "",
    };
    const rows = co.rows.map(k => rowHtml[k]).join("\n      ");
    return `<table cellpadding="0" cellspacing="0" role="presentation" style="${FONT}border-collapse:collapse;">
  <tr>
    ${photoCell}
    <td style="vertical-align:top;">
      ${nameHtml}
      <div style="${FONT}font-size:14px;font-weight:${co.titleWeight};color:${C.title};line-height:1.3;max-width:${co.titleMaxWidth || 260}px;margin-top:2px;">${title}</div>
      ${rows}
      <a href="${escapeHtml(co.url)}" style="display:inline-block;margin-top:${co.logoGap}px;text-decoration:none;border:0;"><img src="${co.logo}" alt="${escapeHtml(co.alt)}" width="${logoW}" height="${logoH}" style="display:block;border:0;width:${logoW}px;height:${logoH}px;max-width:none;min-width:${logoW}px;" /></a>
    </td>
  </tr>
</table>`;
  }

  const TEMPLATES = { photoSide: buildPhotoSideHtml };

  function buildSignatureHtml(data){
    const co = company();
    return TEMPLATES[co.template](data, co);
  }

  function render(){
    const co = company();
    if (!co.ready){
      els.sigPreview.innerHTML = `<div class="pending-note">${t('pending', { label: escapeHtml(co.label), missing: escapeHtml((co.missing && co.missing[lang]) || '') })}</div>`;
    } else {
      els.sigPreview.innerHTML = buildSignatureHtml(state);
    }
    els.draftNote.hidden = !co.draft;
    els.draftNote.textContent = (co.draft && (co.draft[lang] || co.draft)) || '';
    els.copyBtn.disabled = !co.ready;
    fitPreview();
  }

  // La firma real mide lo que mide; si la vista previa es más angosta, se achica en proporción para verla entera.
  function fitPreview(){
    const el = els.sigPreview, card = el.parentElement, cs = getComputedStyle(card);
    el.style.zoom = 1;
    const avail = card.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const w = el.scrollWidth;
    el.style.zoom = w > avail && avail > 0 ? (avail / w).toFixed(3) : 1;
  }
  window.addEventListener('resize', fitPreview);

  function buildToggle(){
    els.toggle.innerHTML = '';
    ORDER.forEach(key => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.dataset.key = key;
      const c = COMPANIES[key];
      if (c.brand) b.style.setProperty('--tile', c.brand.main === '#E5C05B' ? '#D4A82E' : c.brand.main);
      const tag = c.ready ? (c.draft ? '<span class="soon">' + t('draftTag') + '</span>' : '') : '<span class="soon">' + t('soon') + '</span>';
      b.innerHTML = escapeHtml(c.label) + tag;
      b.addEventListener('click', () => setCompany(key));
      els.toggle.appendChild(b);
    });
  }

  function setCompany(key){
    currentKey = key;
    const co = company();
    els.toggle.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.key === key ? 'true' : 'false'));
    els.emailSuffix.textContent = '@' + (co.domain || 'tu-dominio.com');
    state.email = emailFromUser(els.email.value);
    els.rowLinkedin.hidden = !(co.fields && co.fields.linkedin);
    const brand = co.brand || { main: '#3F4152', deep: '#3F4152' }; // sin identidad cargada: gris neutro
    document.documentElement.style.setProperty('--brand', brand.main);
    document.documentElement.style.setProperty('--brand-deep', brand.deep);
    render();
  }

  els.name.addEventListener('input', e => { state.name = e.target.value; render(); });
  els.title.addEventListener('input', e => { state.title = e.target.value; render(); });
  els.email.addEventListener('input', e => { state.email = emailFromUser(e.target.value); render(); });
  els.phone.addEventListener('input', e => { const c = cleanPhone(e.target.value); if (c !== e.target.value) e.target.value = c; state.phone = composePhone(); render(); });
  // Teléfono: código de país (selector) + número; si el número ya empieza con "+", se respeta tal cual.
  function composePhone(){
    const n = cleanPhone(els.phone.value).replace(/\s+/g, ' ').trim();
    if (!n) return '';
    if (n.startsWith('+')) return n;
    const code = els.country.selectedOptions[0] ? els.country.selectedOptions[0].dataset.code : '';
    return code ? code + ' ' + n : n;
  }
  try { const c = localStorage.getItem('gestorCountry'); if (c !== null && [...els.country.options].some(o => o.value === c)) els.country.value = c; } catch (_) {}
  els.country.addEventListener('change', () => { try { localStorage.setItem('gestorCountry', els.country.value); } catch (_) {} state.phone = composePhone(); render(); });

  els.linkedin.addEventListener('input', e => { state.linkedin = e.target.value; render(); });
  // Si alguien pega su email completo (con "@buildyourcastle.ai" incluido),
  // al salir del campo se deja solo el usuario para que no quede duplicado
  // visualmente con el sufijo fijo de al lado.
  els.email.addEventListener('blur', e => {
    const user = e.target.value.trim().split('@')[0];
    e.target.value = user;
  });

  els.photoBtn.addEventListener('click', () => els.photoInput.click());
  els.recropBtn.addEventListener('click', () => { if (pendingImg) openCrop(pendingImg); });
  els.removePhotoBtn.addEventListener('click', () => {
    state.photo = null;
    pendingImg = null;
    els.photoPreview.innerHTML = '';
    els.photoPreview.textContent = t('noPhoto');
    els.recropBtn.hidden = true;
    els.removePhotoBtn.hidden = true;
    render();
  });
  els.photoInput.addEventListener('change', () => {
    const file = els.photoInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => { pendingImg = img; openCrop(img); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    els.photoInput.value = '';
  });

  // --- crop modal: draggable, resizable circular selection over the full image ---
  let dispW = 0, dispH = 0; // displayed image size inside the modal

  function openCrop(img){
    const scale = Math.min(MAX_STAGE / img.width, MAX_STAGE / img.height, 3);
    dispW = img.width * scale;
    dispH = img.height * scale;
    els.cropImgEl.src = img.src;
    els.cropImgEl.style.width = dispW + 'px';
    els.cropImgEl.style.height = dispH + 'px';
    els.cropStage.style.width = dispW + 'px';
    els.cropStage.style.height = dispH + 'px';

    box.size = Math.min(dispW, dispH) * 0.85;
    box.left = (dispW - box.size) / 2;
    box.top = (dispH - box.size) / 2;
    drawBox();
    els.cropOverlay.hidden = false;
  }

  function drawBox(){
    els.cropBox.style.left = box.left + 'px';
    els.cropBox.style.top = box.top + 'px';
    els.cropBox.style.width = box.size + 'px';
    els.cropBox.style.height = box.size + 'px';
  }

  function clampBox(){
    box.size = Math.max(MIN_BOX, Math.min(box.size, dispW, dispH));
    box.left = Math.min(Math.max(0, box.left), dispW - box.size);
    box.top = Math.min(Math.max(0, box.top), dispH - box.size);
  }

  function onDragStart(e, mode){
    dragMode = mode;
    dragStart = { x: e.clientX, y: e.clientY, left: box.left, top: box.top, size: box.size };
    e.target.setPointerCapture(e.pointerId);
    e.stopPropagation();
    e.preventDefault();
  }

  els.cropBox.addEventListener('pointerdown', e => onDragStart(e, 'move'));
  els.cropHandle.addEventListener('pointerdown', e => onDragStart(e, 'resize'));

  function onDragMove(e){
    if (!dragMode) return;
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    if (dragMode === 'move'){
      box.left = Math.min(Math.max(0, dragStart.left + dx), dispW - box.size);
      box.top = Math.min(Math.max(0, dragStart.top + dy), dispH - box.size);
    } else if (dragMode === 'resize'){
      const delta = Math.max(dx, dy); // grow from the bottom-right corner, keep square
      const maxSize = Math.min(dispW - dragStart.left, dispH - dragStart.top);
      box.size = Math.max(MIN_BOX, Math.min(dragStart.size + delta, maxSize));
    }
    drawBox();
  }
  function onDragEnd(){ dragMode = null; }
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);

  els.cropCancel.addEventListener('click', () => { els.cropOverlay.hidden = true; });
  els.cropApply.addEventListener('click', () => {
    if (!pendingImg) return;
    clampBox();
    const naturalScale = pendingImg.width / dispW;
    const sx = box.left * naturalScale;
    const sy = box.top * naturalScale;
    const ssize = box.size * naturalScale;
    const OUT = 320;
    const canvas = document.createElement('canvas');
    canvas.width = OUT; canvas.height = OUT;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(pendingImg, sx, sy, ssize, ssize, 0, 0, OUT, OUT);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
    state.photo = dataUrl;
    els.photoPreview.innerHTML = `<img src="${dataUrl}" alt="Foto" />`;
    els.recropBtn.hidden = false;
    els.removePhotoBtn.hidden = false;
    els.cropOverlay.hidden = true;
    render();
  });

  function showStatus(msg, ok){
    els.status.textContent = msg;
    els.status.className = 'status show ' + (ok ? 'ok' : 'err');
    setTimeout(() => { els.status.className = 'status'; }, 4500);
  }

  els.copyBtn.addEventListener('click', async () => {
    if (!company().ready){
      showStatus(t('needMaterial', { label: company().label }), false);
      return;
    }
    if (!state.name || !state.email || !state.photo){
      showStatus(t('needFields'), false);
      return;
    }
    const html = buildSignatureHtml(state);
    const plain = [state.name, titleCase(state.title), state.email, state.phone, (company().fields && company().fields.linkedin) ? state.linkedin : ''].filter(Boolean).join('\n');
    // Método 1: API moderna del portapapeles (puede estar bloqueada dentro de
    // iframes o en algunos navegadores). Método 2: copiado clásico seleccionando
    // la vista previa y entregando el HTML de la firma en el evento "copy".
    function legacyCopy(){
      const range = document.createRange();
      range.selectNodeContents(els.sigPreview);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      let handled = false;
      const onCopy = e => {
        e.clipboardData.setData('text/html', html);
        e.clipboardData.setData('text/plain', plain);
        e.preventDefault();
        handled = true;
      };
      document.addEventListener('copy', onCopy);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch(_) { ok = false; }
      document.removeEventListener('copy', onCopy);
      sel.removeAllRanges();
      return ok || handled;
    }
    let copied = false;
    try{
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' }),
        })]);
        copied = true;
      }
    } catch(err){ copied = false; }
    if (!copied) copied = legacyCopy();
    if (copied){
      showStatus(t('copied'), true);
    } else {
      showStatus(t('copyFail'), false);
    }
  });

  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    els.toggle.setAttribute('aria-label', t('companyAria'));
    if (!state.photo) els.photoPreview.textContent = t('noPhoto');
    els.langToggle.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
    els.status.className = 'status';
    buildToggle();
    setCompany(currentKey);
  }

  els.langToggle.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("gestorLang", lang); } catch (_) {}
    applyLang();
  }));

  applyLang();
})();
</script>

</body></html>
